# Bounded history polling from authoritative Ditto twins.
# MQTT remains the simulator -> Ditto transport. No simulator fallback.
# Avoid mqtt_consumer reconnect tracking failure after a broker network error.
[agent]
  interval = "5s"
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "opentwins"
  bucket = "default"
[[inputs.http]]
  urls = ["http://ditto-nginx:80/api/2/things/org.openegiz.ventobserve:V7/features"]
  username = "ditto"
  password = "${DITTO_PASSWORD}"
  timeout = "4s"
  data_format = "json_v2"
  [inputs.http.tags]
    thingId = "org.openegiz.ventobserve:V7"
  [[inputs.http.json_v2]]
    measurement_name = "ventobserve_history"
    timestamp_path = "sample.properties.wallTime"
    timestamp_format = "unix"
    [[inputs.http.json_v2.field]]
      path = "methane.properties.value"
      rename = "value_methane_properties_value"
      type = "float"
      optional = true
